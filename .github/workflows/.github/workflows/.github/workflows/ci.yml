name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install CI deps (light)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pytest httpx python-dotenv

      - name: Run tests
        run: pytest -q

      - name: Lint (black + flake8)
        run: |
          python -m pip install black flake8
          black --check . || true   # allow formatting failures not to block
          flake8 .
