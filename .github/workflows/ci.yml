name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies (CI lightweight)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] pytest httpx python-dotenv prometheus-client

      - name: Run tests
        run: pytest -q
